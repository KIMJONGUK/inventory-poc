name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 진행 중이던 실행은 취소한다
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # .env 는 커밋하지 않으므로 CI 에서 직접 준다.
      # verify:prepare 와 vitest 는 각자 verify.db 로 덮어쓰고,
      # 여기 값은 prisma CLI 가 설정을 읽을 때 쓰인다.
      DATABASE_URL: file:./prisma/dev.db
      # 실제 비밀값이 아니다 — CI 에서 session.ts 의 필수 검사를 통과시키기 위한 더미
      SESSION_SECRET: ci-dummy-session-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # prepare → typecheck → lint → test → build (앞 단계가 실패하면 멈춘다)
      - run: npm run verify

  # SSOT §3 보호 영역 — 요구사항·아키텍처·하네스 규칙이 바뀌면 알린다.
  # 막지는 않는다 (경고만). 승인은 PR 리뷰에서 사람이 한다.
  protected-areas:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 보호 영역 변경 확인
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          PROTECTED='
          docs/01-requirements.md
          docs/06-architecture.md
          docs/harness/ssot.md
          AGENTS.md
          CLAUDE.md
          .github/workflows/verify.yml
          scripts/prepare-verify.ts
          scripts/check-architecture.ts
          '

          base=$(git merge-base "origin/$BASE_REF" HEAD)
          changed=$(git diff --name-only "$base" HEAD)

          hits=''
          for path in $PROTECTED; do
            if printf '%s\n' "$changed" | grep -qxF "$path"; then
              hits="$hits  - $path"$'\n'
            fi
          done

          if [ -z "$hits" ]; then
            echo "보호 영역 변경 없음"
            exit 0
          fi

          echo "보호 영역이 변경되었습니다:"
          printf '%s' "$hits"

          # PR 목록·요약에 뜨도록 파일마다 경고 어노테이션을 남긴다
          printf '%s' "$hits" | sed 's/^  - //' | while read -r f; do
            echo "::warning file=$f::보호 영역 파일입니다 (SSOT §3). 변경 내용을 리뷰에서 확인하세요."
          done

          echo
          echo "SSOT §3 — 요구사항 · 아키텍처 · 하네스 규칙입니다."
          echo "경고만 남기고 통과합니다. 승인은 PR 리뷰에서 사람이 합니다."
