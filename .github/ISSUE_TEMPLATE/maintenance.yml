name: 유지보수 작업
description: 고쳤으면 하는 것을 적어주세요
title: "[유지보수] "
labels: ["maintenance"]
body:
  - type: markdown
    attributes:
      value: |
        아는 만큼만 적으면 됩니다.
        작업 범위 · 완료 조건 · 검증 방법은 접수 후 댓글로 정리해 확인을 요청합니다.

  - type: textarea
    id: problem
    attributes:
      label: 무엇이 문제인가요?
      description: 지금 어떻게 동작하는지, 무엇이 불편한지.
      placeholder: |
        팝업 정산에서 시식 칸을 비우고 저장하면 남은 수량이 전부 파손으로 잡힙니다.
    validations:
      required: true

  - type: textarea
    id: where
    attributes:
      label: 어디서 그런가요?
      description: 화면 이름이나 클릭 경로. 넣은 값이 있으면 같이 적어주세요.
      placeholder: |
        팝업 상세 → 정산 → 저장
        반출 20 · 판매 8 · 시식 비움
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 어떻게 되면 좋겠나요?
      description: 기대하는 결과.
      placeholder: |
        시식을 비우면 0 으로 보고, 파손은 0 으로 나왔으면 합니다.
    validations:
      required: true

  - type: dropdown
    id: urgency
    attributes:
      label: 급한가요?
      options:
        - "보통 — 순서대로 처리"
        - "급함 — 지금 운영에 지장이 있다"
        - "천천히 — 개선 제안"
      default: 0
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 참고 (선택)
      description: 스크린샷 · 관련 이슈 · 그 밖에 알아둘 것.
    validations:
      required: false
