name: 유지보수 작업
description: 작업 계약 6개 항목
title: "[유지보수] "
labels: ["maintenance"]
body:
  - type: markdown
    attributes:
      value: |
        **6개 항목이 비면 시작하지 않는다** — 계약이 없으면 완료를 판정할 수 없다 ([SSOT §4](../../docs/harness/ssot.md)).
        모르는 항목은 비워두고 열어도 됩니다. 에이전트가 초안을 댓글로 정리하고, **확정은 사람이** 합니다.
        작업 중 이 범위 밖을 고쳐야 하면 조용히 넓히지 않고 새 Issue 를 엽니다.

  - type: textarea
    id: background
    attributes:
      label: 1. 배경
      description: 왜 필요한가. 지금 어떻게 동작하고 무엇이 문제인가. **구체적 숫자(재현 입력)는 여기에만** 씁니다.
      placeholder: |
        팝업 정산에서 시식 칸을 비우고 저장하면 남은 수량이 전부 파손으로 잡힌다.
        재현: 팝업 상세 → 정산 → 반출 20 · 판매 8 · 시식 비움 → 저장
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: 2. 변경할 내용
      description: 어디를 고치나. 화면 이름 · 클릭 경로 · 아는 파일 경로.
      placeholder: |
        팝업 정산 저장 경로 — 빈 입력을 0 으로 읽도록.
        src/components/SettleForm.tsx
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 3. 종료 조건
      description: 무엇이 참이면 완료인가. **정상 · 경계 · 거부 · 불변 4줄**, 각 줄에 판정할 명령 하나. 관계식으로 쓰고 그 순간의 관찰값(`파손이 12 로 나온다`)은 쓰지 않습니다.
      value: |
        정상 ·
        경계 ·
        거부 · (지정 에러를 던진다)
        불변 · 파손 = 반출 − 판매 − 시식 − 반품
      placeholder: |
        정상 · 시식을 비우면 0 으로 읽는다
        경계 · 네 칸이 다 비면 파손 0
        거부 · 반출보다 많이 되돌리면 지정 에러를 던진다
        불변 · 파손 = 반출 − 판매 − 시식 − 반품
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: 4. 기계 검증
      description: 무엇이 완료를 판정하나. 화면 확인은 판정이 아닙니다. 붙일 명령이 없는 종료 조건은 종료 조건이 아닙니다.
      value: |
        npm run verify
      placeholder: |
        npm run verify
        npm run test -- popup-settle
    validations:
      required: true

  - type: textarea
    id: boundary
    attributes:
      label: 5. 건드리면 안 되는 것
      description: 변경 경계는 어디인가. 기본값은 보호 영역입니다 — 여기를 고쳐야 하면 먼저 사람에게 묻습니다.
      value: |
        docs/harness/** · docs/01-requirements.md · docs/06-architecture.md (읽기만)
        기존 테스트 19건의 기대값
        prisma/dev.db
    validations:
      required: true

  - type: dropdown
    id: loop
    attributes:
      label: 6. 구현 루프 최대 횟수
      description: 검증 실패 시 몇 번까지 재시도하나. 넘으면 멈추고 사람에게 넘깁니다.
      options:
        - "3회 — 기본"
        - "1회 — 한 번 실패하면 바로 넘긴다"
        - "5회 — 원인이 넓을 때"
      default: 0
    validations:
      required: true

  - type: dropdown
    id: urgency
    attributes:
      label: 우선순위
      options:
        - "보통 — 순서대로 처리"
        - "급함 — 지금 운영에 지장이 있다"
        - "천천히 — 개선 제안"
      default: 0
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 참고 (선택)
      description: 스크린샷 · 관련 이슈 · 그 밖에 알아둘 것.
    validations:
      required: false

  - type: checkboxes
    id: gate
    attributes:
      label: 시작 조건
      options:
        - label: 6개 항목을 채웠다 (모르는 항목은 댓글로 확정한다)
          required: true
        - label: 종료 조건 각 줄에 판정할 명령이 하나씩 붙는다
          required: true
        - label: 종료 조건에 구체적 숫자 대신 관계식을 썼다
          required: true
