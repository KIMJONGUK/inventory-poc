name: 유지보수 작업
description: 배경 · 변경할 내용 · 종료 조건 · 테스트 코드 기능명
title: "[유지보수] "
labels: ["maintenance"]
body:
  - type: markdown
    attributes:
      value: |
        4개 항목이 차면 시작합니다. 비면 완료를 판정할 수 없어 시작하지 않습니다 ([SSOT §4](../../docs/harness/ssot.md)).
        남은 계약 항목(건드리면 안 되는 것 · 구현 루프 한도)은 에이전트가 댓글로 제안하고 사람이 확정합니다.

  - type: textarea
    id: background
    attributes:
      label: 1. 배경
      description: 왜 필요한가. 지금 어떻게 동작하고 무엇이 문제인가. **구체적 숫자(재현 입력)는 여기에만** 씁니다.
      placeholder: |
        팝업 정산에서 시식 칸을 비우고 저장하면 남은 수량이 전부 파손으로 잡힌다.
        재현: 팝업 상세 → 정산 → 반출 20 · 판매 8 · 시식 비움 → 저장
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: 2. 변경할 내용
      description: 어디를 고치나. 화면 이름 · 클릭 경로 · 아는 파일 경로.
      placeholder: |
        팝업 정산 저장 경로 — 빈 입력을 0 으로 읽도록.
        src/components/SettleForm.tsx
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 3. 종료 조건
      description: 무엇이 참이면 완료인가. **정상 · 경계 · 거부 · 불변 4줄.** 관계식으로 쓰고 그 순간의 관찰값(`파손이 12 로 나온다`)은 쓰지 않습니다.
      value: |
        정상 ·
        경계 ·
        거부 · (지정 에러를 던진다)
        불변 ·
      placeholder: |
        정상 · 시식을 비우면 0 으로 읽는다
        경계 · 네 칸이 다 비면 파손 0
        거부 · 반출보다 많이 되돌리면 지정 에러를 던진다
        불변 · 파손 = 반출 − 판매 − 시식 − 반품
    validations:
      required: true

  - type: textarea
    id: test
    attributes:
      label: 4. 테스트 코드 기능명
      description: 종료 조건을 판정할 테스트. `파일 > 테스트 이름` 으로 한 줄씩. 아직 없으면 **새로 만들 이름**을 적습니다. 판정은 화면이 아니라 `npm run verify` 가 합니다.
      placeholder: |
        tests/popup-settle.test.ts > 시식이 비면 0 으로 읽는다
        tests/popup-settle.test.ts > 반출보다 많이 되돌리면 거부한다
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 참고 (선택)
      description: 스크린샷 · 관련 이슈 · 급한 정도.
    validations:
      required: false
